<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Solution Digital</title>
<style>
  :root { --noir:#0D0D0D; --rouge:#CC0000; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:#f2f2f2; font-family:Arial, Helvetica, sans-serif; gap:16px; }
  svg { width:320px; height:320px; }
  a.btn { background:var(--rouge); color:#fff; padding:10px 18px; border-radius:8px; text-decoration:none; font-weight:bold; }
</style>
</head>
<body>
<svg id="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="2" y="2" width="196" height="196" rx="28" fill="#0D0D0D" stroke="#CC0000" stroke-width="4"/>
  <line x1="100" y1="34" x2="100" y2="54" stroke="#CC0000" stroke-width="5"/>
  <circle cx="100" cy="30" r="9" fill="#CC0000"/>
  <rect x="44" y="82" width="12" height="28" rx="4" fill="#CC0000"/>
  <rect x="144" y="82" width="12" height="28" rx="4" fill="#CC0000"/>
  <rect x="58" y="54" width="84" height="84" rx="18" fill="#CC0000"/>
  <circle cx="83" cy="95" r="10" fill="#0D0D0D"/>
  <circle cx="117" cy="95" r="10" fill="#0D0D0D"/>
  <rect x="84" y="118" width="32" height="8" rx="4" fill="#0D0D0D"/>
  <text x="100" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="30" fill="#CC0000">SD</text>
</svg>
<a class="btn" id="dl" href="#" download="logo_solution_digital.svg">Télécharger le logo (SVG)</a>
<script>
  const svg = document.getElementById('logo').outerHTML;
  document.getElementById('dl').href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
</script>
</body>
</html>
